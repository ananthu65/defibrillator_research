name: Tests
on:
  pull_request:
  push:
    branches: [main, develop, ananthu_dev]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements/charging-sound.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.run --events tests/fixtures/sample_timeline.json --output data/outputs/ci-assessment.json
