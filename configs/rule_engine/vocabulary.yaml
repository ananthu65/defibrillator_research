schema_version: 1
# Rule engine event vocabulary (owner: Arnikan).
#
# events: the canonical names that rules use. `modality` (video | audio) says which
#         coverage policy applies to the event, whatever source produced it.
#         `provisional: true` marks a name awaiting confirmation; all command names (and
#         the phrases behind them in configs/pipeline.yaml) are provisional until the
#         medical-faculty supervisor confirms them (implementation_plan.md, section E).
# labels: per source (annotation | video | audio), every source label -> one canonical
#         event. Matching is exact. A new label is one line here.
#         `placeholder: true` marks a source label that does not exist yet; replace it
#         with the real name when it is agreed.
#         `resolve_by_shock: {before, after}` marks an ambiguous label. Its event keeps the
#         source label until the procedure context resolves it by its position relative
#         to the shock.
# unused: labels that are known but deliberately not used by any rule, so they are not
#         flagged as unknown. A `prefix` entry matches every label starting with it.
events:
  gel_applied:                   {modality: video, description: Gel applied}
  apical_gel_applied:            {modality: video, description: Gel applied to the apical zone (left side of the ribs)}
  sternal_gel_applied:           {modality: video, description: Gel applied to the sternal zone (on the chest)}
  # Paddle tags: under the team's working definition (A-027) first_paddle_* means the apical paddle and
  # second_paddle_* the sternal paddle. The names give identity only, never time order: the rules
  # compute the order from the event times (D-118). The descriptions keep the original wording.
  first_paddle_taken:            {modality: video, description: First frame where the first paddle is clearly visible}
  first_paddle_placed:           {modality: video, description: First paddle placed firmly on the chest}
  second_paddle_taken:           {modality: video, description: First frame where the second paddle is clearly visible}
  apical_paddle_placed:          {modality: video, description: Apical paddle placed on the chest}
  sternal_paddle_placed:         {modality: video, description: Sternal paddle placed on the chest}
  paddles_firmly_on_chest:       {modality: video, description: Both paddles stable in the approved chest zones}
  both_paddle_buttons_pressed:   {modality: video, description: Both paddle discharge buttons pressed}
  shock_delivered_on_screen:     {modality: video, description: New shock indication on the approved screen}
  paddles_removed_after_shock:   {modality: video, description: Paddles removed from the chest}
  # Command names follow the A1-A6 command wording in the supervisor's proposal document.
  oxygen_away_command:           {modality: audio, provisional: true, description: "A1: free-flow oxygen away"}
  continue_compressions_command: {modality: audio, provisional: true, description: "A2: continue chest compressions (before the shock)"}
  stand_clear_command:           {modality: audio, provisional: true, description: "A3: all stand clear"}
  stop_compressions_command:     {modality: audio, provisional: true, description: "A4: stop chest compressions / hands off"}
  shock_command:                 {modality: audio, provisional: true, description: "A5: DC shock or discharge"}
  start_compressions_command:    {modality: audio, provisional: true, description: "A6: start or resume chest compressions (after the shock)"}
labels:
  annotation:
    - {label: Gel applied,                      event: gel_applied}
    # first_paddle_* = the apical paddle, second_paddle_* = the sternal paddle (A-027); identity, not order (D-118)
    - {label: first_paddle_taken,               event: first_paddle_taken}
    - {label: first_paddle_firmly_on_the_chest, event: first_paddle_placed}
    - {label: second_paddle_taken,              event: second_paddle_taken}
    - {label: paddles_firmly_on_chest,          event: paddles_firmly_on_chest}
    - {label: both_paddle_buttons_pressed,      event: both_paddle_buttons_pressed}
    - {label: shock_delivered_on_screen,        event: shock_delivered_on_screen}
    - {label: paddles_removed_after_shock,      event: paddles_removed_after_shock}
    # Not CVAT tags (CVAT is frozen, D-073): derived from the annotated paddle and zone boxes by the
    # rule-engine exporter (Step 9c, D-081). R8 may use them only after the gate review (D-088).
    - {label: apical_paddle_placed,             event: apical_paddle_placed}
    - {label: sternal_paddle_placed,            event: sternal_paddle_placed}
    # Not CVAT tags: per-zone gel applications derived from the learner_hand and zone boxes (Step 9d,
    # D-111). R1 may use them only after the 9d gate review (D-112).
    - {label: apical_gel_applied,               event: apical_gel_applied}
    - {label: sternal_gel_applied,              event: sternal_gel_applied}
  audio:
    # Names emitted by audio/commands/detect.py from configs/pipeline.yaml `commands`.
    - {label: oxygen_away_command,           event: oxygen_away_command}
    - {label: stand_clear_command,           event: stand_clear_command}
    - {label: resume_compressions_command,   resolve_by_shock: {before: continue_compressions_command, after: start_compressions_command}}
    - {label: continue_compressions_command, event: continue_compressions_command, placeholder: true}
    - {label: stop_compressions_command,     event: stop_compressions_command,     placeholder: true}
    - {label: shock_command,                 event: shock_command,                 placeholder: true}
    - {label: start_compressions_command,    event: start_compressions_command,    placeholder: true}
  video:
    # Video postprocessing emits the agreed canonical names directly (D-020, upstream_requirements.md),
    # so they map to themselves. Raw object presence (object_visible:*) is not evidence.
    - {label: gel_applied,                 event: gel_applied}
    - {label: apical_gel_applied,          event: apical_gel_applied}
    - {label: sternal_gel_applied,         event: sternal_gel_applied}
    # first_paddle_* = the apical paddle, second_paddle_* = the sternal paddle (A-027); identity, not order (D-118)
    - {label: first_paddle_taken,          event: first_paddle_taken}
    - {label: first_paddle_placed,         event: first_paddle_placed}
    - {label: second_paddle_taken,         event: second_paddle_taken}
    - {label: apical_paddle_placed,        event: apical_paddle_placed}
    - {label: sternal_paddle_placed,       event: sternal_paddle_placed}
    - {label: paddles_firmly_on_chest,     event: paddles_firmly_on_chest}
    - {label: both_paddle_buttons_pressed, event: both_paddle_buttons_pressed}
    - {label: shock_delivered_on_screen,   event: shock_delivered_on_screen}
    - {label: paddles_removed_after_shock, event: paddles_removed_after_shock}
unused:
  video:
    - {prefix: "object_visible:"}
  audio:
    - charging_sound
