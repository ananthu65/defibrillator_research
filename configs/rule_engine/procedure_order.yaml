schema_version: 1
# The procedure order as a precedence graph (owner: Arnikan; D-120, D-123). Loaded and validated by
# rules/procedure.py with the catalogue. Read by A7 since Increment 26 (its audio scope); S1
# "Procedure order" will read it from Increment 27.
#
# NOT CLINICALLY APPROVED: the interim order from the lecturer's ground-truth video (D-127), pending
# the supervisor's confirmation (OQ-062). Grouping steps as interchangeable is a config change only
# (OQ-063, OQ-077). To apply the approved order, see audio_integration_plan.md section 11.
approval:
  approved_by: null
  approved_on: null
  source: "the lecturer's ground-truth video, reported by Arnikan on 2026-11-24 (D-127); A4 -> A5 -> R5 from the proposal"
  note: "NOT clinically approved: pending the supervisor's confirmation (OQ-062)"

# Steps: each with the canonical event(s) it is observed as. A `derived` step comes from the paddle
# order (D-118), computed from event times, never from the tag names (A-027):
#   earliest_take       the paddle taken first          later_take   the paddle taken second
#   earliest_placement  the earliest firm placement of either paddle
# An `optional` step, if present, must be in the right place; if absent, nothing is reported missing.
steps:
  A1:     {events: [oxygen_away_command], description: oxygen away}
  A3:     {events: [stand_clear_command], description: all stand clear}
  A2:     {events: [continue_compressions_command], description: continue compressions (before the shock)}
  CHARGE: {events: [charging_command], optional: true, description: "charging (spoken; compulsory? OQ-072)"}
  R1:     {events: [gel_applied, apical_gel_applied, sternal_gel_applied], description: "gel applied to both zones (the gel phase)"}
  GELCMD: {events: [gel_announcement_command], optional: true, description: "\"applying gel\", said during the gel phase (compulsory? OQ-073)"}
  A4:     {events: [stop_compressions_command], description: stop compressions}
  R2A:    {events: [first_paddle_taken, second_paddle_taken], derived: earliest_take, description: the paddle taken first}
  PLACE:  {events: [first_paddle_placed, apical_paddle_placed, sternal_paddle_placed], derived: earliest_placement,
           description: "the first firm placement (R2, R8)"}
  R2B:    {events: [first_paddle_taken, second_paddle_taken], derived: later_take, description: the paddle taken second}
  R3:     {events: [paddles_firmly_on_chest], description: both paddles firmly on the chest}
  A5:     {events: [shock_command], description: "the shock command (not said by the lecturer; required? OQ-075)"}
  R4:     {events: [both_paddle_buttons_pressed], description: both buttons pressed}
  R5:     {events: [shock_delivered_on_screen], description: the shock on the screen}
  R6:     {events: [paddles_removed_after_shock], description: paddles removed}
  R7:     {events: [start_compressions_command], description: start compressions (after the shock)}

# "X before Y": each chain gives consecutive pairs; the engine uses their transitive closure.
chains:
  - chain: [A1, A3, A2, CHARGE, R1, A4, R2A, PLACE, R2B, R3, R4, R5, R6, R7]
    source: "the lecturer's ground-truth video (2026-11-24): oxygen away, stand clear, continue, charging, the gel phase, stop, the paddles, shock, removal, start"
  - chain: [CHARGE, GELCMD, A4]
    source: "the lecturer's ground-truth video: \"applying gel\" is said during the gel phase"
  - {chain: [A4, A5], source: "proposal A7 sequence: stop before the shock command"}
  - {chain: [A5, R5], source: "proposal A5: the shock command before or at the shock"}

# Pairs not ordered yet; they stay unordered (not checked) until the supervisor places them.
# Either {steps, relative_to, question} or {pairs: [[a, b], ...], question}.
unknown:
  - {steps: [A5], relative_to: [R2A, PLACE, R2B, R3, R4], question: OQ-075}   # the lecturer gave no shock command

# Groups whose mutual order is free. The gel and the spoken "applying gel" happen together (D-127).
interchangeable:
  - [R1, GELCMD]

# One owner per relation (D-123). Explicit pairs for the rules that already check them; A7 owns the
# remaining audio-audio pairs; the default owner (S1, planned) owns every other relation that no other
# relation implies (D-126). R8's apical-before-sternal is inside PLACE, so it is not a pair here.
owners:
  R1: [[R1, PLACE]]
  R2: [[R2A, PLACE], [PLACE, R2B], [R2A, R2B]]
  R3: [[R3, R5]]
  R4: [[R3, R4], [R4, R5]]
  R6: [[R5, R6]]
  A1: [[A1, R5]]
  A2: [[A2, R5]]
  A3: [[A3, R5]]
  A4: [[A2, A4], [A4, R5]]
  A5: [[A5, R5]]
  R7: [[R5, R7]]
  A7: {scope: audio}
default_owner: S1   # "Procedure order", planned (Increment 27); not in rules.yaml yet
